[package]
name = "linkterm"
version = "0.1.0"
description = "macOS multi-protocol terminal emulator"
authors = ["Toshiaki0315"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linkterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "rt-multi-thread", "io-util", "net"] }
portable-pty = "0.9.0"
russh = "0.65.0"
keyring = "4.2.0"
zeroize = "1.9.1"
tokio-serial = "5.5.0"
base64 = "0.23.1"
encoding_rs = "0.8.42"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-clipboard-manager = "2.5.0"
russh-sftp = "3.0.1"
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rand = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-text = "22.0.0"
