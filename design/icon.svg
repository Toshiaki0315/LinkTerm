<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1c2b45"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="lowerOverlap"><rect x="540" y="512" width="170" height="160"/></clipPath>
  </defs>
  <!-- macOS風の角丸ベース -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>
  <!-- プロンプト記号 > -->
  <polyline points="196,372 342,512 196,652" fill="none" stroke="url(#sky)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 鎖（リンク）2つ -->
  <rect x="444" y="408" width="240" height="208" rx="104" fill="none" stroke="url(#mint)" stroke-width="54"/>
  <rect x="582" y="408" width="240" height="208" rx="104" fill="none" stroke="url(#sky)" stroke-width="54"/>
  <!-- 交差部の下側だけ前面にして、鎖が絡んで見えるようにする -->
  <rect x="444" y="408" width="240" height="208" rx="104" fill="none" stroke="url(#mint)" stroke-width="54" clip-path="url(#lowerOverlap)"/>
</svg>
